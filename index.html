<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taschenrechner</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            font-family: Arial, sans-serif;
        }
        .calculator {
            width: 320px;
            padding: 20px;
            background: #111827;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0,0,0,.4);
        }
        h2 { color: white; text-align: center; margin-top: 0; }
        #display {
            width: 100%;
            height: 75px;
            margin-bottom: 18px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #e5e7eb;
            color: #111827;
            font-size: 32px;
            text-align: right;
            outline: none;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            height: 58px;
            border: none;
            border-radius: 14px;
            background: #374151;
            color: white;
            font-size: 21px;
            cursor: pointer;
            transition: transform .1s, background .1s;
        }
        button:hover { background: #4b5563; }
        button:active { transform: scale(.94); }
        .operator { background: #2563eb; }
        .operator:hover { background: #1d4ed8; }
        .clear { background: #dc2626; }
        .clear:hover { background: #b91c1c; }
        .equals { background: #16a34a; }
        .equals:hover { background: #15803d; }
        .zero { grid-column: span 2; }
    </style>
</head>
<body>
    <div class="calculator">
        <h2>Taschenrechner</h2>
        <input type="text" id="display" value="0" readonly aria-label="Rechneranzeige">
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">AC</button>
            <button class="operator" onclick="deleteLast()">⌫</button>
            <button class="operator" onclick="percent()">%</button>
            <button class="operator" onclick="chooseOperator('/')">÷</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="chooseOperator('*')">×</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="chooseOperator('-')">−</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="chooseOperator('+')">+</button>

            <button class="zero" onclick="appendNumber('0')">0</button>
            <button onclick="appendDecimal()">,</button>
            <button class="equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById("display");
        let currentValue = "0";
        let previousValue = null;
        let operator = null;
        let resetDisplay = false;

        function updateDisplay() {
            display.value = currentValue.replace(".", ",");
        }

        function appendNumber(number) {
            if (resetDisplay) {
                currentValue = number;
                resetDisplay = false;
            } else if (currentValue === "0") {
                currentValue = number;
            } else {
                currentValue += number;
            }
            updateDisplay();
        }

        function appendDecimal() {
            if (resetDisplay) {
                currentValue = "0";
                resetDisplay = false;
            }
            if (!currentValue.includes(".")) currentValue += ".";
            updateDisplay();
        }

        function chooseOperator(nextOperator) {
            if (operator !== null && !resetDisplay) calculate();
            previousValue = Number(currentValue);
            operator = nextOperator;
            resetDisplay = true;
        }

        function calculate() {
            if (operator === null || previousValue === null) return;
            const current = Number(currentValue);
            let result;

            switch (operator) {
                case "+": result = previousValue + current; break;
                case "-": result = previousValue - current; break;
                case "*": result = previousValue * current; break;
                case "/":
                    if (current === 0) {
                        currentValue = "Fehler";
                        previousValue = null;
                        operator = null;
                        resetDisplay = true;
                        updateDisplay();
                        return;
                    }
                    result = previousValue / current;
                    break;
            }

            currentValue = String(
                Number.isFinite(result) ? Number(result.toPrecision(12)) : "Fehler"
            );
            previousValue = null;
            operator = null;
            resetDisplay = true;
            updateDisplay();
        }

        function clearDisplay() {
            currentValue = "0";
            previousValue = null;
            operator = null;
            resetDisplay = false;
            updateDisplay();
        }

        function deleteLast() {
            if (resetDisplay || currentValue === "Fehler") {
                clearDisplay();
                return;
            }
            currentValue = currentValue.slice(0, -1);
            if (currentValue === "" || currentValue === "-") currentValue = "0";
            updateDisplay();
        }

        function percent() {
            if (currentValue === "Fehler") return;
            currentValue = String(Number(currentValue) / 100);
            updateDisplay();
        }

        // Bedienung mit der Tastatur
        document.addEventListener("keydown", (event) => {
            if (event.key >= "0" && event.key <= "9") appendNumber(event.key);
            else if (event.key === ".") appendDecimal();
            else if (event.key === ",") appendDecimal();
            else if (["+", "-", "*", "/"].includes(event.key)) chooseOperator(event.key);
            else if (event.key === "Enter" || event.key === "=") calculate();
            else if (event.key === "Escape") clearDisplay();
            else if (event.key === "Backspace") deleteLast();
            else if (event.key === "%") percent();
        });
    </script>
</body>
</html>
